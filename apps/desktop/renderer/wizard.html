<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donna — Configuração</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --surface:   #16213e;
      --border:    #0f3460;
      --accent:    #e94560;
      --accent-h:  #c73652;
      --text:      #e0e0e0;
      --muted:     #8888aa;
      --input-bg:  #0d1b35;
      --radius:    10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Layout ─────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px 48px;
      gap: 24px;
    }

    /* ── Progress bar ───────────────────────────────── */
    #progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      position: fixed;
      top: 0; left: 0;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.35s ease;
    }

    /* ── Logo / header ──────────────────────────────── */
    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #e94560, #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .step-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .step-subtitle {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      max-width: 380px;
    }

    /* ── Form elements ──────────────────────────────── */
    .field {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }

    .error-msg {
      color: var(--accent);
      font-size: 12px;
      min-height: 16px;
    }

    /* ── Radio cards ────────────────────────────────── */
    .channels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }
    .channels.providers {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .channel-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 13px;
    }
    .channel-card:hover { border-color: #4a4a8a; }
    .channel-card.selected {
      border-color: var(--accent);
      background: #1e1040;
    }
    .channel-card input { display: none; }
    .channel-icon { font-size: 20px; }

    /* ── Buttons ────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .btn-secondary {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); }

    /* ── Done screen ────────────────────────────────── */
    .done-icon {
      font-size: 64px;
      line-height: 1;
    }

    /* ── Inline row for preferences ─────────────────── */
    .pref-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    /* ── Step indicator ─────────────────────────────── */
    .step-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s, width 0.2s;
    }
    .dot.active { background: var(--accent); width: 18px; border-radius: 3px; }
    .dot.done   { background: #4a4a8a; }

    /* ── Error states ──────────────────────────────── */
    input.error, select.error {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.25);
    }

    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .error-msg {
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* ── Bridge error banner ───────────────────────── */
    .bridge-error {
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
<div id="app"></div>

<script>
"use strict";

// ── Bridge safety ─────────────────────────────────────────────────────────────

const bridgeAvailable = !!(window.donna && window.donna.wizard);

const bridge = bridgeAvailable
  ? window.donna.wizard
  : {
      getState:   async () => ({ currentStep:"welcome", stepIndex:0, totalSteps:6, data:{ language:"pt", port:18789, theme:"system", channel:"none" }, errors:{}, completed:false }),
      advance:    async () => null,
      back:       async () => null,
      updateData: async () => null,
      complete:   async () => null,
    };

// ── State ────────────────────────────────────────────────────────────────────

let state = null;

async function loadState() {
  try { state = await bridge.getState(); }
  catch { state = { currentStep:"welcome", stepIndex:0, totalSteps:6, data:{ language:"pt", port:18789, theme:"system", channel:"none" }, errors:{}, completed:false }; }
}

// ── Render dispatcher ─────────────────────────────────────────────────────────

function render() {
  const pct = Math.round((state.stepIndex / (state.totalSteps - 1)) * 100);
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("app").innerHTML = "";

  const stepMap = { welcome, "provider": provider, channel, telegram, preferences, done };
  const fn = stepMap[state.currentStep];
  if (fn) fn();
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (typeof child === "string") node.append(child);
    else if (child) node.append(child);
  }
  return node;
}

function app(...children) {
  document.getElementById("app").append(...children.flat());
}

function dots() {
  const steps = ["welcome","provider","channel","telegram","preferences","done"];
  return el("div", { class: "step-dots" },
    steps.map((s, i) => el("div", {
      class: "dot" + (i === state.stepIndex ? " active" : i < state.stepIndex ? " done" : "")
    }))
  );
}

async function advance() {
  try {
    const result = await bridge.advance();
    if (result) state = result;

    // Show validation errors with shake
    if (state.errors && Object.keys(state.errors).length > 0) {
      for (const [field, msg] of Object.entries(state.errors)) {
        showFieldError(field, msg);
      }
      return;
    }

    render();
  } catch {
    // Bridge call failed — stay on current step
  }
}

async function back() {
  try {
    const result = await bridge.back();
    if (result) state = result;
    render();
  } catch {
    // Bridge call failed — stay on current step
  }
}

async function updateData(patch) {
  try {
    const result = await bridge.updateData(patch);
    if (result) state = result;
  } catch {
    // Silently handle bridge errors for data updates
    state.data = { ...state.data, ...patch };
  }
}

// ── Validation helpers ────────────────────────────────────────────────────────

function showFieldError(field, msg) {
  const inp = document.querySelector(`[data-field="${field}"]`);
  if (inp) {
    inp.classList.add("error", "shake");
    inp.addEventListener("animationend", () => inp.classList.remove("shake"), { once: true });
  }
  const errEl = document.querySelector(`[data-error="${field}"]`);
  if (errEl) {
    errEl.textContent = msg;
    errEl.classList.add("visible");
  }
}

function clearFieldError(field) {
  const inp = document.querySelector(`[data-field="${field}"]`);
  if (inp) inp.classList.remove("error");
  const errEl = document.querySelector(`[data-error="${field}"]`);
  if (errEl) {
    errEl.textContent = "";
    errEl.classList.remove("visible");
  }
}

const PROVIDERS = [
  { id: "anthropic", name: "Anthropic", icon: "🟠", prefix: "sk-ant-", placeholder: "sk-ant-api03-...", required: true, minLen: 20 },
  { id: "openai", name: "OpenAI", icon: "🟢", prefix: "sk-", placeholder: "sk-proj-...", required: true, minLen: 20 },
  { id: "google", name: "Google Gemini", icon: "🔵", prefix: "", placeholder: "AIzaSy...", required: true, minLen: 10 },
  { id: "openrouter", name: "OpenRouter", icon: "🟣", prefix: "sk-or-", placeholder: "sk-or-v1-...", required: true, minLen: 20 },
  { id: "ollama", name: "Ollama (local)", icon: "🦙", prefix: "", placeholder: "Sem key necessária", required: false, minLen: 0 },
  { id: "mistral", name: "Mistral", icon: "🌀", prefix: "", placeholder: "sua-api-key...", required: true, minLen: 10 },
  { id: "xai", name: "xAI (Grok)", icon: "⚡", prefix: "xai-", placeholder: "xai-...", required: true, minLen: 10 },
];

function getProvider(id) {
  return PROVIDERS.find(p => p.id === id) || PROVIDERS[0];
}

function validateApiKey(value, providerId) {
  const p = getProvider(providerId || state.data.provider);
  if (!p.required) return "";
  const trimmed = value.trim();
  if (!trimmed) return "";
  if (p.prefix && !trimmed.startsWith(p.prefix)) return `Deve começar com ${p.prefix}`;
  if (trimmed.length < p.minLen) return "A key é muito curta";
  return "";
}

function validatePort(value) {
  const num = parseInt(value, 10);
  if (isNaN(num)) return "Porta inválida";
  if (num < 1024 || num > 65535) return "Porta deve ser entre 1024 e 65535";
  return "";
}

// ── Steps ─────────────────────────────────────────────────────────────────────

function welcome() {
  app(
    el("div", { class: "logo" }, "Donna"),
    el("div", { class: "step-title" }, "Bem-vinda de volta"),
    el("div", { class: "step-subtitle" },
      "Sua secretária inteligente e autônoma. Vamos configurar tudo em menos de 2 minutos."
    ),
    dots(),
    el("div", { class: "btn-row" },
      el("button", { class: "btn-primary", onClick: advance }, "Começar →")
    )
  );
}

function provider() {
  const selected = { value: state.data.provider || "anthropic" };
  const currentProvider = () => getProvider(selected.value);

  const keyField = el("div", { class: "field", id: "key-field" });
  const keyError = el("div", { class: "error-msg", "data-error": "apiKey" }, state.errors.apiKey || "");

  function renderKeyInput() {
    const p = currentProvider();
    keyField.innerHTML = "";
    if (!p.required) {
      keyField.append(
        el("div", { class: "step-subtitle", style: "color: #4caf50;" },
          "Ollama roda localmente — sem API key necessária"
        )
      );
      return;
    }
    const inp = el("input", {
      type: "password",
      placeholder: p.placeholder,
      value: state.data.apiKey || "",
      "data-field": "apiKey"
    });
    inp.addEventListener("input", () => {
      updateData({ apiKey: inp.value });
      const err = validateApiKey(inp.value, selected.value);
      if (err) showFieldError("apiKey", err);
      else clearFieldError("apiKey");
    });
    keyField.append(
      el("label", {}, "API Key"),
      inp,
      keyError
    );
  }

  function makeProviderCard(p) {
    const card = el("label", {
      class: "channel-card" + (selected.value === p.id ? " selected" : "")
    },
      el("span", { class: "channel-icon" }, p.icon),
      p.name
    );
    card.addEventListener("click", async () => {
      selected.value = p.id;
      await updateData({ provider: p.id, apiKey: "" });
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      renderKeyInput();
    });
    return card;
  }

  app(
    el("div", { class: "step-title" }, "Escolha o Modelo de IA"),
    el("div", { class: "step-subtitle" }, "Qual provider você quer usar com a Donna?"),
    dots(),
    el("div", { class: "channels providers" }, PROVIDERS.map(makeProviderCard)),
    keyField,
    el("div", { class: "btn-row" },
      el("button", { class: "btn-secondary", onClick: back }, "← Voltar"),
      el("button", { class: "btn-primary", onClick: advance }, "Continuar →")
    )
  );

  renderKeyInput();
}

function channel() {
  const channels = [
    { id: "telegram", icon: "✈️", label: "Telegram" },
    { id: "whatsapp", icon: "💬", label: "WhatsApp" },
    { id: "discord",  icon: "🎮", label: "Discord"  },
    { id: "slack",    icon: "⚡", label: "Slack"    },
    { id: "none",     icon: "⏭️", label: "Mais tarde" },
  ];

  const selected = { value: state.data.channel || "none" };

  function makeCard(ch) {
    const card = el("label", { class: "channel-card" + (selected.value === ch.id ? " selected" : "") },
      el("span", { class: "channel-icon" }, ch.icon),
      ch.label
    );
    card.addEventListener("click", async () => {
      selected.value = ch.id;
      await updateData({ channel: ch.id });
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
    });
    return card;
  }

  app(
    el("div", { class: "step-title" }, "Canal de Mensagens"),
    el("div", { class: "step-subtitle" }, "Onde você quer conversar com a Donna?"),
    dots(),
    el("div", { class: "channels" }, channels.map(makeCard)),
    el("div", { class: "btn-row" },
      el("button", { class: "btn-secondary", onClick: back }, "← Voltar"),
      el("button", { class: "btn-primary", onClick: advance }, "Continuar →")
    )
  );
}

function telegram() {
  const tokenInp = el("input", {
    type: "password",
    placeholder: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz...",
    value: state.data.telegramToken || "",
    "data-field": "telegramToken"
  });

  const botNameEl = el("div", { class: "step-subtitle", style: "color: #4caf50; min-height: 20px;" },
    state.data.telegramBotName ? `Bot: @${state.data.telegramBotName}` : ""
  );

  tokenInp.addEventListener("input", () => {
    updateData({ telegramToken: tokenInp.value });
    const val = tokenInp.value.trim();
    if (!val) {
      clearFieldError("telegramToken");
      botNameEl.textContent = "";
      return;
    }
    if (!/^\d{8,}:[A-Za-z0-9_-]{30,}$/.test(val)) {
      showFieldError("telegramToken", "Token inválido. Formato: 123456789:ABCdef...");
      botNameEl.textContent = "";
    } else {
      clearFieldError("telegramToken");
      // Validate via main process IPC (avoids leaking token from renderer)
      if (bridgeAvailable && bridge.validateTelegramToken) {
        bridge.validateTelegramToken(val)
          .then(result => {
            if (result && result.ok && result.username) {
              botNameEl.textContent = `Bot: @${result.username}`;
              botNameEl.style.color = "#4caf50";
              updateData({ telegramBotName: result.username });
            } else {
              botNameEl.textContent = result?.error || "Token não reconhecido pelo Telegram";
              botNameEl.style.color = "var(--accent)";
            }
          })
          .catch(() => {
            botNameEl.textContent = "Não foi possível verificar";
            botNameEl.style.color = "var(--muted)";
          });
      } else {
        // Fallback: skip validation in offline/mock mode
        botNameEl.textContent = "Token será validado ao salvar";
        botNameEl.style.color = "var(--muted)";
      }
    }
  });

  app(
    el("div", { class: "step-title" }, "Conectar Telegram"),
    el("div", { class: "step-subtitle" },
      "Cole o token do seu bot. Crie um em @BotFather no Telegram."
    ),
    dots(),
    el("div", { class: "field" },
      el("label", {}, "Bot Token"),
      tokenInp,
      el("div", { class: "error-msg", "data-error": "telegramToken" }, state.errors.telegramToken || "")
    ),
    botNameEl,
    el("div", { class: "step-subtitle", style: "font-size: 12px; margin-top: 4px;" },
      "Opcional — você pode configurar depois."
    ),
    el("div", { class: "btn-row" },
      el("button", { class: "btn-secondary", onClick: back }, "← Voltar"),
      el("button", { class: "btn-primary", onClick: advance },
        state.data.telegramToken ? "Continuar →" : "Pular →"
      )
    )
  );
}

function preferences() {
  const portInp = el("input", {
    type: "number",
    value: String(state.data.port || 18789),
    min: "1024", max: "65535",
    "data-field": "port"
  });
  portInp.addEventListener("input", () => {
    const val = parseInt(portInp.value, 10);
    updateData({ port: val });
    const err = validatePort(portInp.value);
    if (err) showFieldError("port", err);
    else clearFieldError("port");
  });

  const langSel = el("select", {},
    el("option", { value: "pt" }, "Português"),
    el("option", { value: "en" }, "English")
  );
  langSel.value = state.data.language || "pt";
  langSel.addEventListener("change", () => updateData({ language: langSel.value }));

  const themeSel = el("select", {},
    el("option", { value: "system" }, "Sistema"),
    el("option", { value: "dark" },   "Escuro"),
    el("option", { value: "light" },  "Claro")
  );
  themeSel.value = state.data.theme || "system";
  themeSel.addEventListener("change", () => updateData({ theme: themeSel.value }));

  app(
    el("div", { class: "step-title" }, "Preferências"),
    el("div", { class: "step-subtitle" }, "Personalize como a Donna funciona"),
    dots(),
    el("div", { class: "pref-grid" },
      el("div", { class: "field" }, el("label", {}, "Idioma"), langSel),
      el("div", { class: "field" }, el("label", {}, "Tema"),   themeSel)
    ),
    el("div", { class: "field" },
      el("label", {}, "Porta do Gateway"),
      portInp,
      el("div", { class: "error-msg", "data-error": "port" }, state.errors.port || "")
    ),
    el("div", { class: "btn-row" },
      el("button", { class: "btn-secondary", onClick: back }, "← Voltar"),
      el("button", { class: "btn-primary", onClick: advance }, "Finalizar →")
    )
  );
}

function done() {
  async function handleComplete() {
    try {
      await bridge.complete();
    } catch {
      // If complete fails, show inline feedback
      const btn = document.querySelector(".btn-primary");
      if (btn) {
        btn.textContent = "Erro — tente novamente";
        btn.style.opacity = "0.7";
        setTimeout(() => {
          btn.textContent = "Abrir Donna →";
          btn.style.opacity = "1";
        }, 2000);
      }
    }
  }

  app(
    el("div", { class: "done-icon" }, "🎉"),
    el("div", { class: "step-title" }, "Donna está pronta!"),
    el("div", { class: "step-subtitle" },
      "O gateway está iniciando. Você verá o ícone da Donna na barra de menu."
    ),
    dots(),
    el("div", { class: "btn-row" },
      el("button", { class: "btn-primary", onClick: handleComplete }, "Abrir Donna →")
    )
  );
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

(async () => {
  await loadState();
  render();
  if (!bridgeAvailable) {
    document.getElementById("app").prepend(
      el("div", { class: "bridge-error" },
        "Modo offline — ponte IPC não detectada. Algumas funções podem não funcionar."
      )
    );
  }
})();
</script>

</body>
</html>
