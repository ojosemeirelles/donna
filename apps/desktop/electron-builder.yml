appId: com.nova.donna
productName: Donna

directories:
  output: release

files:
  - dist/**/*
  - "!dist/packages/**"
  - renderer/**
  - assets/**
  - package.json

extraResources:
  - from: "../../donna.mjs"
    to: "donna-core/donna.mjs"
  - from: "../../dist/"
    to: "donna-core/dist/"
    filter:
      - "**/*"
  - from: "../../package.json"
    to: "donna-core/package.json"
  - from: "../../node_modules/"
    to: "donna-core/node_modules/"
    filter:
      - "**/*"
      - "!.cache/**"
      - "!**/test/**"
      - "!**/tests/**"

# CONVERGENCE NOTE (2026-03-08):
# The macOS target below is DEPRECATED in favor of the native SwiftUI app
# at apps/macos/. The SwiftUI app provides 25+ features not available here
# (Voice Wake, Talk Mode, Canvas, Channels Settings, launchd integration, etc.).
#
# This Electron app will be kept for Windows only.
# See: docs/architecture/desktop-convergence-plan.md
#
# Phase 2 of the convergence plan will remove this mac: block entirely.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: scripts/entitlements.mac.plist
  entitlementsInherit: scripts/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: ojosemeirelles
  repo: donna
